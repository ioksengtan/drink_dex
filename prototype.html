<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部件組合測試</title>
<style>
body { margin: 0; padding: 20px 16px 40px; background: #F3F6F4; color: #1B2A25; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
main { max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin: 0 0 4px; }
p { margin: 0 0 16px; color: #5A6B64; font-size: .9rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
figure { margin: 0; background: #fff; border-radius: 10px; padding: 6px 6px 8px; text-align: center; font-size: .8rem; }
.stage { position: relative; width: 100%; aspect-ratio: 1; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
figcaption { color: #5A6B64; }
</style>
</head>
<body>
<main>
  <h1>部件組合測試</h1>
  <p>用插畫家交來的原型部件，依圖層順序疊出 3 種眼神 × 4 種表情。目前只有髮型 1、服裝 green、身體 3_2。</p>
  <div class="grid" id="grid"></div>
</main>
<script>
const DIR = "assets/prototype/";
const EYES = ["睡眼惺忪", "眼神清醒", "睜大眼睛"];
const EXPR = ["平靜", "微笑", "開心笑臉", "眨眼吐舌"];

// 依圖層順序（由下到上）列出要疊的檔案。eyes：1～3，expr：1～4，其餘為已有的原型部件。
function layers({ eyes, expr, hair = 1, body = "3_2", outfit = "green_3" }) {
  const wink = expr === 4;
  return [
    `hair_${hair}_back`, `body_${body}`, `outfit_${outfit}`, "head_1",
    `eyes_${eyes}_left`, wink ? "eyes_wink" : `eyes_${eyes}_right`,
    `mouth_${expr}`,
    ...(expr === 3 ? ["mouth_blush"] : []),
    ...(expr === 4 ? ["mouth_tongue"] : []),
    `hair_${hair}_front`,
  ];
}

const grid = document.getElementById("grid");
for (let e = 1; e <= 3; e++) for (let x = 1; x <= 4; x++) {
  const imgs = layers({ eyes: e, expr: x }).map(n => `<img src="${DIR}${n}.png" alt="" loading="eager">`).join("");
  grid.insertAdjacentHTML("beforeend",
    `<figure><div class="stage">${imgs}</div><figcaption>${EYES[e - 1]}・${EXPR[x - 1]}</figcaption></figure>`);
}
</script>
</body>
</html>
